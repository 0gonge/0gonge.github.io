{% if jekyll.environment == "production" and site.ga4_measurement_id %}
<!-- Google Analytics is enabled only in production builds. -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.ga4_measurement_id | escape }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() { dataLayer.push(arguments); }
  gtag('js', new Date());
  gtag('config', {{ site.ga4_measurement_id | jsonify }}, {
    allow_google_signals: false,
    allow_ad_personalization_signals: false
  });
</script>
{% endif %}
